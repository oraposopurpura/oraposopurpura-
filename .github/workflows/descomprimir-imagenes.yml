name: Preparar imagenes de O Raposo Purpura
on:
  push:
    paths:
      - .github/workflows/descomprimir-imagenes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extraer fotografias del ZIP
        run: |
          unzip -o -q raposo_imagenes_web.zip -d .
          test -s assets/retrato-nacho.webp
          test -s assets/logo.webp
          git add assets/
          if git diff --cached --quiet; then
            echo 'Las imagenes ya estaban extraidas'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Extraer fotografias y logotipo en assets'
          git push
